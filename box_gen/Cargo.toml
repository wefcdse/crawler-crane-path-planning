[package]
name = "box_gen"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["lib"]
[dependencies]
obj-rs = "0.7.4"
smallvec = { version = "1.13.2", features = ["union"] }
clap = { version = "4.5.23", features = ["derive"] }
rand = "0.8.5"
rayon = "1.10.0"
serde = "1.0.215"
serde_json = "1.0.133"
lazy_static = "1.5.0"
utm = "0.1.6"
nalgebra = "0.33.2"
stupid_utils = "*"
impl_here = "*"
log = "0.4.27"

[profile.dev]
opt-level = 3
[profile.release]
debug = true
